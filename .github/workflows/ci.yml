name: CI

on:
    pull_request:

jobs:
    lint:
        name: shellcheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: apt-get update && apt-get install -y shellcheck
            - run: make check

    format:
        name: shfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: apt-get update && apt-get install -y shfmt
            - run: make fmt_check
